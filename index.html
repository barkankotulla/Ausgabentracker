<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Ausgaben</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>try { const t = localStorage.getItem('ausgaben.theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #fafaf9;
    --surface: #ffffff;
    --text: #1c1917;
    --muted: #a8a29e;
    --line: #e7e5e4;
    --in: #16a34a;
    --out: #dc2626;
    --in-bg: #effcf3;
    --out-bg: #fef1f1;
    --in-line: #c6f0d4;
    --out-line: #fbd5d5;
    --field: rgb(255 255 255 / .75);
    --key: rgb(255 255 255 / .85);
    --in-chart: #16a34a;
    --out-chart: #dc2626;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0c0a09; --surface: #1c1917; --text: #f5f5f4; --muted: #78716c; --line: #292524;
      --in: #4ade80; --out: #f87171; --in-bg: #0f2117; --out-bg: #2a1212; --in-line: #1a3a26; --out-line: #4a1d1d;
      --field: rgb(0 0 0 / .25); --key: rgb(255 255 255 / .06); --in-chart: #22c55e; --out-chart: #ef4444;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0c0a09; --surface: #1c1917; --text: #f5f5f4; --muted: #78716c; --line: #292524;
    --in: #4ade80; --out: #f87171; --in-bg: #0f2117; --out-bg: #2a1212; --in-line: #1a3a26; --out-line: #4a1d1d;
    --field: rgb(0 0 0 / .25); --key: rgb(255 255 255 / .06); --in-chart: #22c55e; --out-chart: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 "Plus Jakarta Sans", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
  }
  main {
    max-width: 520px; margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; }
  svg { display: block; }

  /* Kopfzeile */
  .top { display: flex; align-items: center; gap: 4px; min-height: 36px; }
  .top .pill { margin-right: auto; font-size: 12px; font-weight: 600; color: var(--out); background: var(--out-bg); border-radius: 99px; padding: 6px 12px; }
  .top .spacer { margin-right: auto; }
  .icon { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); transition: background .15s, color .15s; }
  .icon:hover { background: var(--line); color: var(--text); }
  .icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Monat + Saldo */
  .month { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .month span { font-size: 14px; font-weight: 600; }
  .balance { text-align: center; margin: 18px 0 6px; font-size: 46px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; transition: color .25s; }
  .balance.pos { color: var(--in); }
  .balance.neg { color: var(--out); }
  .split { display: flex; justify-content: center; gap: 20px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .split b { font-weight: 600; }
  #sumIn { color: var(--in); }
  #sumOut { color: var(--out); }

  /* Formular */
  #form {
    --tone: var(--out); --tone-bg: var(--out-bg); --tone-line: var(--out-line);
    margin: 28px 0 24px; background: var(--tone-bg); border: 1px solid var(--tone-line); border-radius: var(--radius);
    padding: 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; transition: background .25s, border-color .25s;
  }
  #form[data-type="in"] { --tone: var(--in); --tone-bg: var(--in-bg); --tone-line: var(--in-line); }
  .seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--field); border-radius: 10px; padding: 3px; }
  .seg::before {
    content: ''; position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / var(--n, 2));
    border-radius: 8px; background: var(--tone, var(--text)); opacity: var(--on, 0);
    transform: translateX(calc(var(--i, 0) * 100%));
    transition: transform .42s var(--spring), background .25s, opacity .2s;
  }
  .seg button { position: relative; padding: 7px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--muted); transition: color .25s; }
  .seg button[aria-pressed="true"] { color: var(--tone-fg, #fff); }
  .amount-wrap { display: flex; align-items: baseline; gap: 8px; }
  .amount { flex: 1; min-width: 0; color: var(--tone); font-size: 30px; font-weight: 700; letter-spacing: -.02em; border: 0; background: none; outline: none; padding: 4px 2px; font-variant-numeric: tabular-nums; transition: color .25s; }
  .amount::placeholder { color: var(--tone); opacity: .3; }
  .preview { color: var(--tone); font-weight: 600; font-variant-numeric: tabular-nums; opacity: .7; white-space: nowrap; }

  .keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .keypad button { height: 44px; border-radius: 10px; background: var(--key); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; transition: transform .08s, background .15s; user-select: none; }
  .keypad button:active { transform: scale(.95); }
  .keypad .op { color: var(--tone); }
  .keypad .eq { grid-row: span 2; height: auto; background: var(--tone); color: #fff; }
  .keypad .zero { grid-column: span 2; }

  .row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .keypad { min-width: 0; }
  .field { background: var(--field); border: 1px solid transparent; border-radius: 10px; padding: 9px 10px; width: 100%; outline: none; font-size: 14px; min-width: 0; appearance: none; -webkit-appearance: none; }
  .field:focus, .field:focus-within { border-color: var(--tone-line, var(--line)); background: var(--surface); }
  .field::placeholder { color: var(--muted); }
  select.field { cursor: pointer; }
  .inline { display: flex; align-items: center; gap: 6px; padding-top: 0; padding-bottom: 0; }
  .inline span { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .inline input, .inline select { border: 0; background: none; outline: none; padding: 9px 0; min-width: 0; font-size: 14px; }
  .inline input[type="number"] { width: 3.2em; flex: none; }
  .inline input[type="date"] { flex: 1; }
  .inline select { flex: 1; cursor: pointer; }

  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: -2px 0; padding: 2px 0; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; font-size: 13px; font-weight: 500; padding: 5px 12px; border-radius: 99px; background: var(--field); color: var(--text); transition: background .15s, color .15s; }
  .chip.on { background: var(--tone); color: #fff; }

  .actions { display: flex; gap: 8px; }
  .save { flex: 1; background: var(--tone); color: #fff; border-radius: 10px; padding: 12px; font-weight: 600; transition: background .25s, transform .1s, filter .15s; }
  .save:hover { filter: brightness(1.08); }
  .save:active { transform: scale(.98); }
  .ghost { padding: 11px 14px; border-radius: 10px; color: var(--muted); font-weight: 500; }
  .ghost:hover { background: var(--field); color: var(--text); }

  /* Liste */
  .day { font-size: 12px; font-weight: 500; color: var(--muted); margin: 18px 4px 4px; }
  .item { display: flex; align-items: center; gap: 8px; padding: 8px 0 8px 4px; border-bottom: 1px solid var(--line); cursor: pointer; min-height: 52px; }
  .item.future .info, .item.future .val { opacity: .45; }
  .info { flex: 1; min-width: 0; }
  .cat { font-weight: 600; }
  .note { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rep { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 6px; }
  .val { font-variant-numeric: tabular-nums; font-weight: 700; }
  .val.in { color: var(--in); }
  .val.out { color: var(--out); }
  .del { width: 32px; height: 32px; border-radius: 50%; color: var(--muted); font-size: 18px; flex: none; opacity: .5; transition: opacity .15s, background .15s, color .15s; }
  .item:hover .del { opacity: 1; }
  .del:hover { background: var(--out-bg); color: var(--out); }
  .ask { display: flex; gap: 6px; }
  .ask button { font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 99px; background: var(--out-bg); color: var(--out); }
  .ask button:last-child { background: var(--out); color: #fff; }
  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 40px 0; }

  /* Analyse */
  #analysis { width: min(560px, calc(100% - 32px)); }
  .range { font-size: 13px; color: var(--muted); text-align: center; font-weight: 500; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile { background: var(--bg); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .tile span { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
  .tile b { display: block; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.in b { color: var(--in); }
  .tile.out b { color: var(--out); }
  .legend { display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--muted); font-weight: 500; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .legend button { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted); padding: 4px 8px; border-radius: 8px; }
  .legend button:hover { background: var(--bg); color: var(--text); }
  .chart { position: relative; touch-action: pan-y; }
  .chart svg { width: 100%; overflow: visible; }
  .chart text { font-size: 11px; fill: var(--muted); font-family: inherit; font-variant-numeric: tabular-nums; }
  .chart text.cur { fill: var(--text); font-weight: 700; }
  .chart .grid { stroke: var(--line); }
  .chart .base { stroke: var(--muted); stroke-opacity: .6; }
  .chart .bar-in { fill: var(--in-chart); }
  .chart .bar-out { fill: var(--out-chart); }
  .chart .g { transition: opacity .15s; }
  .chart .g.future { opacity: .45; }
  .chart.hovering .g:not(.active) { opacity: .3; }
  .chart .hit { fill: transparent; }
  .tip { position: absolute; top: -6px; pointer-events: none; background: var(--text); color: var(--bg); border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.55; white-space: nowrap; transform: translate(-50%, -100%); box-shadow: 0 6px 18px rgb(0 0 0 / .2); font-variant-numeric: tabular-nums; z-index: 1; }
  .tip b { display: block; font-weight: 700; }
  .tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  .tip span { float: right; margin-left: 14px; font-weight: 600; }
  table.months { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  .months th, .months td { text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  .months th:first-child, .months td:first-child { text-align: left; }
  .months th { color: var(--muted); font-weight: 500; }
  .crow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 12px; padding: 7px 0; }
  .cname { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cval { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; text-align: right; }
  .cval small { color: var(--muted); font-weight: 500; margin-left: 8px; display: inline-block; min-width: 3.2em; }
  .cbar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; }
  .cbar i { display: block; height: 100%; border-radius: 3px; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
    display: flex; align-items: center; gap: 14px; background: var(--text); color: var(--bg); border-radius: 99px;
    padding: 10px 10px 10px 18px; font-size: 14px; font-weight: 500; box-shadow: 0 8px 24px rgb(0 0 0 / .18);
    transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { font-weight: 700; padding: 5px 12px; border-radius: 99px; background: rgb(127 127 127 / .25); }
  .toast { transition: opacity .2s, transform .35s var(--spring); }

  /* Schmale Bildschirme: Datum | Wiederholung, darunter Kategorie mit den Vorschlägen direkt darunter */
  @media (max-width: 480px) {
    .balance { font-size: 42px; }
    #form { padding: 12px; }
    .row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #category { grid-column: 1 / -1; order: 1; }
    .row2 { grid-template-columns: minmax(0, 1fr); }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tiles .tile:last-child { grid-column: 1 / -1; }
    .sheet { padding: 16px 16px 20px; }
  }
  /* Touch: 16px verhindert das automatische Hineinzoomen beim Antippen von Feldern */
  @media (pointer: coarse) {
    .field, .inline input, .inline select { font-size: 16px; }
    .keypad button { height: 48px; }
    .del { width: 40px; height: 40px; }
  }

  /* Bewegung */
  :root { --ease: cubic-bezier(.2, .9, .3, 1); --spring: cubic-bezier(.3, 1.35, .5, 1); }
  .reveal { display: grid; grid-template-rows: 0fr; margin-top: -10px; opacity: 0; transition: grid-template-rows .34s var(--ease), margin-top .34s var(--ease), opacity .22s; }
  .reveal > div { overflow: hidden; min-height: 0; }
  .reveal.open { grid-template-rows: 1fr; margin-top: 0; opacity: 1; }
  .reveal.open .keypad button { animation: keyIn .36s var(--spring) backwards; animation-delay: calc(var(--k) * 9ms); }
  @keyframes keyIn { from { opacity: 0; transform: translateY(8px) scale(.92); } }

  .icon, .chip, .ghost, .btn, .ask button, .snap button { transition: background .15s, color .15s, transform .18s var(--spring); }
  .icon:active, .chip:active, .ghost:active, .btn:active, .ask button:active { transform: scale(.9); }
  .seg button:active { transform: scale(.96); }
  .keypad button { transition: transform .18s var(--spring), background .15s; }
  .keypad button:active { transform: scale(.9); transition-duration: .05s; }

  .item.enter { animation: enter .5s var(--ease), glow 1.4s ease-out; }
  .item.t-in { --glow: var(--in-bg); }
  .item.t-out { --glow: var(--out-bg); }
  @keyframes enter { from { opacity: 0; transform: translateY(-10px) scale(.98); } }
  @keyframes glow { from { background: var(--glow); } }
  .item.leave {
    overflow: hidden; min-height: 0; height: 0 !important; padding-top: 0; padding-bottom: 0; opacity: 0;
    transform: translateX(-28px); border-color: transparent;
    transition: height .26s var(--ease), padding .26s var(--ease), opacity .18s, transform .26s var(--ease), border-color .26s;
  }
  .ask { animation: askIn .28s var(--spring); }
  @keyframes askIn { from { opacity: 0; transform: translateX(10px) scale(.95); } }

  .slide-next { animation: slideNext .36s var(--ease); }
  .slide-prev { animation: slidePrev .36s var(--ease); }
  @keyframes slideNext { from { opacity: 0; transform: translateX(32px); } }
  @keyframes slidePrev { from { opacity: 0; transform: translateX(-32px); } }

  .shake { animation: shake .38s ease-in-out; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .save.pop { animation: pop .42s var(--spring); }
  @keyframes pop { 30% { transform: scale(.95); } 65% { transform: scale(1.03); } }
  .preview:not(:empty) { animation: fadeUp .2s var(--ease); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } }

  dialog[open] { animation: dlgIn .36s var(--spring); }
  dialog[open]::backdrop { animation: fadeIn .25s ease-out; }
  dialog.closing { animation: dlgOut .18s ease-in forwards; }
  dialog.closing::backdrop { animation: fadeOut .18s ease-in forwards; }
  @keyframes dlgIn { from { opacity: 0; transform: translateY(14px) scale(.96); } }
  @keyframes dlgOut { to { opacity: 0; transform: translateY(8px) scale(.97); } }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes fadeOut { to { opacity: 0; } }

  .chart path { transform-box: fill-box; transform-origin: bottom; animation: grow .6s var(--ease) backwards; animation-delay: calc(var(--d) * 30ms); }
  @keyframes grow { from { transform: scaleY(0); } }
  .cbar i { animation: widen .7s var(--ease) backwards; }
  @keyframes widen { from { width: 0; } }

  .no-tr, .no-tr * { transition: none !important; }
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after, ::backdrop { animation: none !important; transition: none !important; }
  }

  /* Einstellungen */
  dialog { margin: auto; border: 0; padding: 0; background: var(--surface); color: var(--text); border-radius: 18px; width: min(480px, calc(100% - 32px)); max-height: calc(100dvh - 32px); overscroll-behavior: contain; box-shadow: 0 24px 64px rgb(0 0 0 / .25); }
  dialog::backdrop { background: rgb(0 0 0 / .35); backdrop-filter: blur(3px); }
  .sheet { padding: 18px 20px 22px; display: grid; gap: 10px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; }
  .sheet h2 { font-size: 18px; font-weight: 700; }
  .sheet h3 { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 12px; }
  .sheet .seg { background: var(--bg); --tone: var(--text); --tone-fg: var(--bg); }
  .sheet .field { background: var(--bg); }
  .hint { font-size: 13px; color: var(--muted); }
  .hint b { color: var(--text); font-weight: 600; }
  .cat-row { display: flex; gap: 6px; align-items: center; }
  .cat-add { display: flex; gap: 6px; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .btn { font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); cursor: pointer; transition: background .15s; }
  .btn:hover { background: var(--line); }
  .btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .snap { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .snap small { color: var(--muted); margin-left: 6px; }
  .snap button { font-size: 13px; font-weight: 600; color: var(--muted); padding: 4px 8px; border-radius: 8px; }
  .snap button:hover { background: var(--bg); color: var(--text); }
</style>
</head>
<body>
<main>
  <div class="top">
    <button class="pill" id="permPill" hidden>Sicherung freigeben</button>
    <span class="spacer" id="spacer"></span>
    <button class="icon" id="analysisBtn" aria-label="Analyse">
      <svg viewBox="0 0 24 24"><path d="M6 20v-8M12 20V5M18 20v-5"/></svg>
    </button>
    <button class="icon" id="themeBtn" aria-label="Hell / Dunkel"></button>
    <button class="icon" id="settingsBtn" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
    </button>
  </div>

  <header>
    <div class="month">
      <button class="icon" id="prev" aria-label="Vorheriger Monat">‹</button>
      <span id="monthLabel"></span>
      <button class="icon" id="next" aria-label="Nächster Monat">›</button>
    </div>
    <div class="balance" id="balance">0,00 €</div>
    <div class="split">
      <span>Einnahmen <b id="sumIn">0,00 €</b></span>
      <span>Ausgaben <b id="sumOut">0,00 €</b></span>
    </div>
  </header>

  <form id="form" data-type="out" autocomplete="off">
    <div class="seg" id="typeSeg">
      <button type="button" data-type="out" aria-pressed="true">Ausgabe</button>
      <button type="button" data-type="in" aria-pressed="false">Einnahme</button>
    </div>
    <div class="amount-wrap">
      <input class="amount" id="amount" inputmode="decimal" placeholder="0,00 €" autofocus>
      <span class="preview" id="preview"></span>

<script>
const KEY = 'ausgaben.data';
const BACKUP_KEY = 'ausgaben.backups';
const THEME_KEY = 'ausgaben.theme';
const MAX_SNAPSHOTS = 20;
const PRESETS = { weekly: { n: 1, unit: 'week' }, monthly: { n: 1, unit: 'month' }, yearly: { n: 1, unit: 'year' } };
const UNIT = { day: ['täglich', 'Tage'], week: ['wöchentlich', 'Wochen'], month: ['monatlich', 'Monate'], year: ['jährlich', 'Jahre'] };
const DAY = 864e5;

const $ = id => document.getElementById(id);
const eur = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });
const monthFmt = new Intl.DateTimeFormat('de-DE', { month: 'long', year: 'numeric' });
const dayFmt = new Intl.DateTimeFormat('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
const shortFmt = new Intl.DateTimeFormat('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
const stampFmt = new Intl.DateTimeFormat('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });

const ICON_MOON = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
const ICON_SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

let state = load();
let type = 'out';
let editingId = null;
let pendingDel = null;
let justAdded = null;
let catType = 'out';
let view = new Date(); view.setDate(1);

/* ---------- Ton ---------- */

// Kleine Synthesizer-Töne über Web Audio: keine Dateien, keine Ladezeit
const sound = (() => {
  const SOUND_KEY = 'ausgaben.sound';
  let enabled = true;
  try { enabled = localStorage.getItem(SOUND_KEY) !== 'off'; } catch {}
  let ctx, master;

  const warm = () => {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 4200;
      master = ctx.createGain(); master.gain.value = 0.55;
      master.connect(lp).connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
  };

  function tone(freq, { t = 0, dur = 0.08, type = 'sine', gain = 0.1, to, attack = 0.004 } = {}) {
    const s = ctx.currentTime + t;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, s);
    if (to) o.frequency.exponentialRampToValueAtTime(to, s + dur);
    g.gain.setValueAtTime(0, s);
    g.gain.linearRampToValueAtTime(gain, s + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
    o.connect(g).connect(master);
    o.start(s); o.stop(s + dur + 0.02);
  }

  const SOUNDS = {
    tap:    () => tone(1150, { dur: 0.035, type: 'triangle', gain: 0.05, to: 750 }),
    key:    () => tone(720 + Math.random() * 50, { dur: 0.05, type: 'triangle', gain: 0.07, to: 480 }),
    toggle: () => tone(540, { dur: 0.09, gain: 0.07, to: 820 }),
    swipe:  () => tone(1500, { dur: 0.04, gain: 0.035, to: 900 }),
    in:     () => { tone(880, { dur: 0.2, gain: 0.08 }); tone(1318.5, { t: 0.075, dur: 0.32, gain: 0.07 }); },
    out:    () => { tone(659.3, { dur: 0.18, gain: 0.08 }); tone(987.8, { t: 0.075, dur: 0.26, gain: 0.06 }); },
    delete: () => tone(440, { dur: 0.17, gain: 0.09, to: 170 }),
    undo:   () => tone(300, { dur: 0.15, gain: 0.07, to: 620 }),
    error:  () => { tone(190, { dur: 0.1, type: 'triangle', gain: 0.12 }); tone(165, { t: 0.09, dur: 0.12, type: 'triangle', gain: 0.1 }); },
    open:   () => tone(420, { dur: 0.16, gain: 0.04, to: 700 }),
    close:  () => tone(640, { dur: 0.12, gain: 0.035, to: 400 }),
  };
  const HAPTIC = { key: 5, tap: 5, toggle: 8, in: 14, out: 14, delete: 12, error: [12, 50, 12] };

  return {
    get enabled() { return enabled; },
    set(on) { enabled = on; try { localStorage.setItem(SOUND_KEY, on ? 'on' : 'off'); } catch {} },
    warm() { if (enabled) try { warm(); } catch {} },
    play(name) {
      if (!enabled) return;
      try { warm(); SOUNDS[name](); } catch {}
      if (HAPTIC[name] && navigator.vibrate) try { navigator.vibrate(HAPTIC[name]); } catch {}
    },
  };
})();
document.addEventListener('pointerdown', () => sound.warm(), { once: true });

/* ---------- Bewegung ---------- */

const reduced = matchMedia('(prefers-reduced-motion: reduce)');

// Zahlen weich hoch- bzw. runterzählen
function tween(el, to) {
  const from = el._v ?? to;
  el._v = to;
  cancelAnimationFrame(el._raf);
  if (reduced.matches || from === to || document.hidden) { el.textContent = eur.format(to); return; }
  el.textContent = eur.format(from);
  const t0 = performance.now(), D = 520;
  const step = now => {
    const p = Math.min(1, (now - t0) / D), e = 1 - (1 - p) ** 3;
    el.textContent = eur.format(from + (to - from) * e);
    if (p < 1) el._raf = requestAnimationFrame(step);
  };
  el._raf = requestAnimationFrame(step);
}

// Segment-Umschalter: gleitende Markierung
function press(seg, isOn) {
  const bs = [...seg.querySelectorAll('button')];
  let idx = -1;
  bs.forEach((b, i) => { const on = !!isOn(b); b.setAttribute('aria-pressed', on); if (on) idx = i; });
  seg.style.setProperty('--n', bs.length);
  seg.style.setProperty('--i', Math.max(idx, 0));
  seg.style.setProperty('--on', idx >= 0 ? 1 : 0);
}

// Animation neu starten, auch wenn die Klasse schon gesetzt war
function replay(el, cls) {
  if (reduced.matches) return;
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
}

// Zeilen zusammenfalten, danach die eigentliche Änderung ausführen
function animateOut(selector, then) {
  const els = [...$('list').querySelectorAll(selector)];
  if (!els.length || reduced.matches) return then();
  els.forEach(el => { el.style.height = el.offsetHeight + 'px'; });
  void document.body.offsetHeight;
  els.forEach(el => el.classList.add('leave'));
  setTimeout(then, 260);
}

function openDialog(d) {
  d.showModal();
  sound.play('open');
}

function closeDialog(d) {
  if (!d.open || d.classList.contains('closing')) return;
  sound.play('close');
  if (reduced.matches) return d.close();
  d.classList.add('closing');
  setTimeout(() => { d.classList.remove('closing'); d.close(); }, 180);
}

/* ---------- Daten ---------- */

function normalize(d) {
  if (Array.isArray(d)) d = { entries: d };
  const entries = (d.entries || []).map(e => ({
    ...e,
    category: e.category || '',
    note: e.note || '',
    repeat: typeof e.repeat === 'string' ? (PRESETS[e.repeat] ? { ...PRESETS[e.repeat], until: '' } : null) : e.repeat || null,
    skip: e.skip || [],
  }));
  return { entries, cats: { out: [...(d.cats?.out || [])], in: [...(d.cats?.in || [])] } };
}

function load() {
  try {
    const raw = localStorage.getItem(KEY) ?? localStorage.getItem('ausgaben.v1');
    if (raw) return normalize(JSON.parse(raw));
  } catch {}
  return normalize({});
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
  scheduleFolderBackup();
}

// Änderung mit Rückgängig-Möglichkeit
function withUndo(msg, fn, reviveId) {
  const prev = JSON.stringify(state);
  fn();
  save(); render(); renderChips();
  toast(msg, () => {
    state = normalize(JSON.parse(prev));
    justAdded = reviveId;
    sound.play('undo');
    save(); render(); renderChips();
  });
}

const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const dayNum = d => Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY);
const fromDayNum = n => { const d = new Date(n * DAY); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtNum = n => n.toLocaleString('de-DE', { maximumFractionDigits: 2, useGrouping: false });

/* ---------- Taschenrechner ---------- */

function parseNum(t) {
  if (t.includes(',')) return Number(t.replace(/\./g, '').replace(',', '.'));
  if (/^\d{1,3}(\.\d{3})+$/.test(t)) return Number(t.replace(/\./g, ''));
  return Number(t);
}

// Grundrechenarten mit Punkt-vor-Strich, ohne eval
function calc(str) {
  const s = str.replace(/[\s€]/g, '').replace(/×/g, '*').replace(/[÷:]/g, '/').replace(/[−–]/g, '-').replace(/[-+*/]+$/, '');
  const t = s.match(/\d[\d.,]*|[-+*/]/g);
  if (!t || t.join('') !== s) return NaN;
  let i = 0;
  const num = () => {
    let sign = 1;
    while (t[i] === '-' || t[i] === '+') if (t[i++] === '-') sign = -sign;
    if (!/\d/.test(t[i] || '')) throw 0;
    return sign * parseNum(t[i++]);
  };
  const term = () => {
    let v = num();
    while (t[i] === '*' || t[i] === '/') { const op = t[i++], r = num(); v = op === '*' ? v * r : v / r; }
    return v;
  };
  try {
    let v = term();
    while (t[i] === '+' || t[i] === '-') { const op = t[i++], r = term(); v = op === '+' ? v + r : v - r; }
    return i === t.length && isFinite(v) ? v : NaN;
  } catch { return NaN; }
}

const hasOperator = s => /[-+*/×÷−:]/.test(s.replace(/^[-−]/, ''));

function updatePreview() {
  const v = $('amount').value;
  const r = hasOperator(v) ? calc(v) : NaN;
  $('preview').textContent = isNaN(r) ? '' : '= ' + eur.format(r);
}

function keypadInput(k) {
  const a = $('amount');
  if (document.activeElement !== a) a.focus();
  const s = a.selectionStart ?? a.value.length, e = a.selectionEnd ?? s;
  if (k === 'C') a.value = '';
  else if (k === 'back') {
    if (s !== e) a.setRangeText('', s, e, 'end');
    else if (s > 0) a.setRangeText('', s - 1, s, 'end');
  } else if (k === '=') {
    const r = calc(a.value);
    if (!isNaN(r)) a.value = fmtNum(Math.round(r * 100) / 100);
  } else a.setRangeText(k, s, e, 'end');
  sound.play(k === '=' ? 'toggle' : 'key');
  updatePreview();
}

/* ---------- Wiederholung ---------- */

// Alle Vorkommen eines Eintrags im Monat (Wiederholungen werden virtuell erzeugt)
function occurrencesIn(e, y, m) {
  const start = parseISO(e.date);
  const first = new Date(y, m, 1), last = new Date(y, m + 1, 0);
  const until = e.repeat?.until ? parseISO(e.repeat.until) : null;
  const end = until && until < last ? until : last;
  if (start > end) return [];
  let out = [];
  if (!e.repeat) {
    if (start >= first) out = [start];
  } else if (e.repeat.unit === 'day' || e.repeat.unit === 'week') {
    const step = e.repeat.n * (e.repeat.unit === 'week' ? 7 : 1);
    const s = dayNum(start), f = dayNum(first), l = dayNum(end);
    for (let k = s >= f ? s : s + Math.ceil((f - s) / step) * step; k <= l; k += step) out.push(fromDayNum(k));
  } else {
    const step = e.repeat.n * (e.repeat.unit === 'year' ? 12 : 1);
    const diff = y * 12 + m - (start.getFullYear() * 12 + start.getMonth());
    if (diff >= 0 && diff % step === 0) {
      const d = new Date(y, m, Math.min(start.getDate(), last.getDate()));
      if (d <= end) out.push(d);
    }
  }
  return e.skip.length ? out.filter(d => !e.skip.includes(iso(d))) : out;
}

const repeatText = r => (r.n === 1 ? UNIT[r.unit][0] : `alle ${r.n} ${UNIT[r.unit][1]}`) + (r.until ? ` · bis ${shortFmt.format(parseISO(r.until))}` : '');

function readRepeat() {
  const v = $('repeat').value;
  if (!v) return null;
  const base = v === 'custom' ? { n: Math.max(1, parseInt($('every').value, 10) || 1), unit: $('unit').value } : { ...PRESETS[v] };
  return { ...base, until: $('until').value };
}

function writeRepeat(r) {
  if (!r) $('repeat').value = '';
  else {
    $('repeat').value = Object.keys(PRESETS).find(k => r.n === 1 && PRESETS[k].unit === r.unit) || 'custom';
    $('every').value = r.n;
    $('unit').value = r.unit;
    $('until').value = r.until || '';
  }
  syncRepeatUI();
}

function syncRepeatUI() {
  const v = $('repeat').value;
  $('repeatExtra').classList.toggle('open', !!v);
  $('repeatExtra').inert = !v;
  $('customWrap').hidden = v !== 'custom';
}

/* ---------- Anzeige ---------- */

function render(slide) {
  const y = view.getFullYear(), m = view.getMonth();
  $('monthLabel').textContent = monthFmt.format(view);
  if (slide) { replay($('monthLabel'), 'slide-' + slide); replay($('list'), 'slide-' + slide); }

  const rows = state.entries
    .flatMap(e => occurrencesIn(e, y, m).map(on => ({ e, on })))
    .sort((a, b) => b.on - a.on || b.e.created - a.e.created);

  let sumIn = 0, sumOut = 0;
  for (const { e } of rows) e.type === 'in' ? sumIn += e.amount : sumOut += e.amount;
  const bal = sumIn - sumOut;
  tween($('balance'), bal);
  $('balance').className = 'balance' + (bal > 0.004 ? ' pos' : bal < -0.004 ? ' neg' : '');
  tween($('sumIn'), sumIn);
  tween($('sumOut'), sumOut);

  const added = justAdded;
  justAdded = null;
  if (!rows.length) { $('list').innerHTML = '<p class="empty">Noch keine Einträge in diesem Monat.</p>'; return; }

  const today = new Date(); today.setHours(0, 0, 0, 0);
  let html = '', lastDay = '';
  for (const { e, on } of rows) {
    const key = iso(on);
    if (key !== lastDay) { html += `<div class="day">${dayFmt.format(on)}</div>`; lastDay = key; }
    const asking = pendingDel?.id === e.id && pendingDel.date === key;
    html += `
      <div class="item t-${e.type}${on > today ? ' future' : ''}${e.id === added ? ' enter' : ''}" data-id="${e.id}" data-date="${key}">
        <div class="info">
          <div class="cat">${esc(e.category || (e.type === 'in' ? 'Einnahme' : 'Ausgabe'))}${e.repeat ? `<span class="rep">↻ ${repeatText(e.repeat)}</span>` : ''}</div>
          ${e.note ? `<div class="note">${esc(e.note)}</div>` : ''}
        </div>
        ${asking
          ? `<div class="ask"><button data-del-one="${e.id}" data-date="${key}">Nur diesen</button><button data-del-all="${e.id}">Alle</button></div>`
          : `<div class="val ${e.type}">${e.type === 'in' ? '+' : '−'}${eur.format(e.amount)}</div>
             <button class="del" data-del="${e.id}" data-date="${key}" aria-label="Löschen">×</button>`}
      </div>`;
  }
  $('list').innerHTML = html;
}

function renderChips() {
  const cur = $('category').value.trim();
  const cats = state.cats[type];
  $('chips').hidden = !cats.length;
  $('chips').innerHTML = cats.map(c => `<button type="button" class="chip${c === cur ? ' on' : ''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
}

function setType(t) {
  type = t;
  $('form').dataset.type = t;
  press($('typeSeg'), b => b.dataset.type === t);
  renderChips();
}

/* ---------- Formular ---------- */

function resetForm() {
  editingId = null;
  $('form').reset();
  $('date').value = iso(new Date());
  $('preview').textContent = '';
  setType(type);
  syncRepeatUI();
  $('save').textContent = 'Hinzufügen';
  $('cancel').hidden = $('delEdit').hidden = true;
  $('amount').focus();
}

function startEdit(id) {
  const e = state.entries.find(x => x.id === id);
  if (!e) return;
  editingId = id;
  $('amount').value = fmtNum(e.amount);
  $('date').value = e.date;
  $('category').value = e.category;

    $('amount').focus();
    return;

  if (category && !state.cats[type].includes(category)) state.cats[type].push(category);

  };

    state.entries.push({ id: justAdded, created: Date.now(), skip: [], ...data });

  const next = isDark() ? 'light' : 'dark';
  sound.play('toggle');
  if (!document.startViewTransition || reduced.matches || document.hidden) return setTheme(next);
  const r = $('themeBtn').getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  const rad = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const root = document.documentElement;
  const vt = document.startViewTransition(() => { root.classList.add('no-tr'); setTheme(next); });
  vt.ready.then(() => root.animate(
    { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${rad}px at ${x}px ${y}px)`] },
    { duration: 520, easing: 'cubic-bezier(.4, 0, .2, 1)', pseudoElement: '::view-transition-new(root)' }
  ));
  vt.finished.finally(() => root.classList.remove('no-tr'));
});

/* ---------- Sicherung ---------- */

// Interne Schnappschüsse im Browser (schnell, synchron)
function readSnapshots() {
  try { return JSON.parse(localStorage.getItem(BACKUP_KEY)) || []; } catch { return []; }
}

function snapshot() {
  if (!state.entries.length) return;
  const list = readSnapshots();
  const data = JSON.stringify(state);
  if (list[0]?.data === data) return;
  list.unshift({ at: Date.now(), data });
  try { localStorage.setItem(BACKUP_KEY, JSON.stringify(list.slice(0, MAX_SNAPSHOTS))); } catch {}
}

// Mini-Schlüsselspeicher in IndexedDB für den gewählten Sicherungsordner
const kv = (() => {
  let db;
  const open = () => db ??= new Promise((res, rej) => {
    const r = indexedDB.open('ausgaben', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  const run = async (mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => {
      const tx = d.transaction('kv', mode), req = fn(tx.objectStore('kv'));
      tx.oncomplete = () => res(req.result);
      tx.onerror = () => rej(tx.error);
    });
  };
  return { get: k => run('readonly', s => s.get(k)), set: (k, v) => run('readwrite', s => s.put(v, k)) };
})();

const folderSupported = 'showDirectoryPicker' in window;
let folder = null;
let folderState = folderSupported ? 'none' : 'unsupported'; // none | ok | perm | error | unsupported
let lastFolderBackup = null;
let folderTimer;

async function backupToFolder(ask) {
  if (!folder) return;
  try {
    let perm = await folder.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted' && ask) perm = await folder.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') { folderState = 'perm'; return renderBackup(); }
    const file = await folder.getFileHandle(`ausgaben-${iso(new Date())}.json`, { create: true });
    const w = await file.createWritable();
    await w.write(JSON.stringify(state, null, 1));
    await w.close();
    folderState = 'ok';
    lastFolderBackup = new Date();
  } catch {
    folderState = 'error';
  }
  renderBackup();
}

function scheduleFolderBackup() {
  clearTimeout(folderTimer);
  if (folderState === 'ok') folderTimer = setTimeout(backupToFolder, 1500);
}

function renderBackup() {
  const status = {
    unsupported: 'Automatische Ordner-Sicherung geht nur in Chrome oder Edge. Lokale Schnappschüsse laufen trotzdem bei jedem Öffnen.',
    none: 'Bei jedem Öffnen wird ein lokaler Schnappschuss gespeichert. Wähle zusätzlich einen Ordner, zum Beispiel in OneDrive, Dropbox oder Google Drive, dann landet die Sicherung automatisch auch in der Cloud.',
    ok: `Sichert automatisch in <b>${esc(folder?.name || '')}</b>${lastFolderBackup ? `, zuletzt um ${lastFolderBackup.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })}` : ''}.`,
    perm: `Der Browser braucht eine erneute Freigabe für <b>${esc(folder?.name || '')}</b>.`,
    error: 'Die letzte Ordner-Sicherung ist fehlgeschlagen. Wähle den Ordner neu.',
  }[folderState];
  $('backupStatus').innerHTML = status;
  $('folderBtn').hidden = !folderSupported;
  $('folderBtn').textContent = folderState === 'perm' ? 'Freigeben' : folder ? 'Ordner ändern' : 'Ordner wählen';
  $('permPill').hidden = folderState !== 'perm';
  $('spacer').hidden = folderState === 'perm';

  const snaps = readSnapshots();
  $('snapList').innerHTML = snaps.length
    ? snaps.map((s, i) => {
        let n = 0; try { n = JSON.parse(s.data).entries.length; } catch {}
        return `<div class="snap"><span>${stampFmt.format(s.at)}<small>${n} Einträge</small></span><button data-snap="${i}">Wiederherstellen</button></div>`;
      }).join('')
    : '<p class="hint">Noch keine Schnappschüsse.</p>';
}

function restore(data, msg) {
  const next = normalize(data);
  sound.play('in');
  snapshot();
  withUndo(msg, () => { state = next; });
  resetForm();
  renderBackup(); renderCats();
}

async function chooseFolder() {
  if (folderState === 'perm') return backupToFolder(true);
  try {
    folder = await showDirectoryPicker({ id: 'ausgaben', mode: 'readwrite' });

    await backupToFolder(true);
  } catch {}
}

/* ---------- Analyse ---------- */

let period = 'month';
const monthShort = new Intl.DateTimeFormat('de-DE', { month: 'short' });
const shortMonth = (y, m) => monthShort.format(new Date(y, m, 1)).replace('.', '');

function monthsFor(p) {
  const y = view.getFullYear(), m = view.getMonth();
  if (p === 'month') return [[y, m]];
  if (p === 'year') return Array.from({ length: 12 }, (_, i) => [y, i]);
  return Array.from({ length: 12 }, (_, i) => { const d = new Date(y, m - 11 + i, 1); return [d.getFullYear(), d.getMonth()]; });
}

function sumMonth(y, m, cats) {
  let sIn = 0, sOut = 0;
  for (const e of state.entries) {
    const n = occurrencesIn(e, y, m).length;
    if (!n) continue;
    const v = n * e.amount;
    if (e.type === 'in') sIn += v; else sOut += v;
    if (cats) { const k = e.category || 'Ohne Kategorie'; cats[e.type].set(k, (cats[e.type].get(k) || 0) + v); }
  }
  return { in: sIn, out: sOut };
}

function renderAnalysis() {
  press($('periodSeg'), b => b.dataset.period === period);
  const months = monthsFor(period);
  const cats = { in: new Map(), out: new Map() };
  let tIn = 0, tOut = 0;
  for (const [y, m] of months) { const s = sumMonth(y, m, cats); tIn += s.in; tOut += s.out; }

  const [fy, fm] = months[0], [ly, lm] = months[months.length - 1];
  $('rangeLabel').textContent = period === 'month' ? monthFmt.format(view)
    : period === 'year' ? String(fy)
    : `${shortMonth(fy, fm)} ${fy} – ${shortMonth(ly, lm)} ${ly}`;
  tween($('aIn'), tIn);
  tween($('aOut'), tOut);
  tween($('aBal'), tIn - tOut);

  // Verlauf: im Jahresmodus das Kalenderjahr, sonst die letzten 12 Monate
  const data = monthsFor(period === 'year' ? 'year' : '12').map(([y, m]) => ({ y, m, ...sumMonth(y, m) }));
  renderChart(data);
  $('monthTable').innerHTML = `<table class="months"><thead><tr><th>Monat</th><th>Einnahmen</th><th>Ausgaben</th><th>Saldo</th></tr></thead><tbody>${
    data.map(d => `<tr><td>${shortMonth(d.y, d.m)} ${d.y}</td><td>${eur.format(d.in)}</td><td>${eur.format(d.out)}</td><td>${eur.format(d.in - d.out)}</td></tr>`).join('')
  }</tbody></table>`;

  $('catOut').innerHTML = catList(cats.out, 'out');
  $('catIn').innerHTML = catList(cats.in, 'in');
}

function catList(map, t) {
  const rows = [...map].sort((a, b) => b[1] - a[1]);
  if (!rows.length) return `<p class="hint">Keine ${t === 'in' ? 'Einnahmen' : 'Ausgaben'} in diesem Zeitraum.</p>`;
  const total = rows.reduce((s, r) => s + r[1], 0), max = rows[0][1];
  return rows.map(([k, v]) => `
    <div class="crow">
      <span class="cname">${esc(k)}</span>
      <span class="cval">${eur.format(v)}<small>${Math.round(v / total * 100)} %</small></span>
      <div class="cbar"><i style="width:${(v / max * 100).toFixed(1)}%;background:var(--${t}-chart)"></i></div>
    </div>`).join('');
}

const niceStep = x => { const p = 10 ** Math.floor(Math.log10(x)), f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; };
const axisNum = v => v >= 1000 ? fmtNum(v / 1000) + 'k' : fmtNum(v);
const barPath = (x, y, w, y0) => { const r = Math.min(4, y0 - y, w / 2); return `M${x},${y0}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y0}Z`; };

function renderChart(data) {
  const el = $('chart');
  const max = Math.max(0, ...data.flatMap(d => [d.in, d.out]));
  if (!max) { el.innerHTML = '<p class="hint" style="text-align:center;padding:28px 0">Noch keine Daten für diesen Zeitraum.</p>'; return; }

  const W = el.clientWidth || 480, H = 200, padL = 34, padT = 8, padB = 24;
  const plotW = W - padL, plotH = H - padT - padB;
  const step = niceStep(max / 3), top = Math.ceil(max / step) * step;
  const yS = v => padT + plotH - v / top * plotH, y0 = yS(0);
  const gw = plotW / data.length, bw = Math.max(3, Math.min(16, (gw * 0.62 - 2) / 2));
  const today = new Date();
  const showAll = data.length <= 6 || W >= 420;

  let svg = '';
  for (let t = step; t <= top + 1e-9; t += step) {
    svg += `<line class="grid" x1="${padL}" x2="${W}" y1="${yS(t)}" y2="${yS(t)}"/><text x="${padL - 8}" y="${yS(t) + 4}" text-anchor="end">${axisNum(t)}</text>`;
  }
  data.forEach((d, i) => {
    const cx = padL + gw * (i + 0.5);
    const future = new Date(d.y, d.m, 1) > today;
    const cur = d.y === view.getFullYear() && d.m === view.getMonth();
    svg += `<g class="g${future ? ' future' : ''}" data-g="${i}" style="--d:${i}">`;
    if (d.in) svg += `<path class="bar-in" d="${barPath(cx - 1 - bw, yS(d.in), bw, y0)}"/>`;
    if (d.out) svg += `<path class="bar-out" d="${barPath(cx + 1, yS(d.out), bw, y0)}"/>`;
    svg += `</g>`;
    if (showAll || (data.length - 1 - i) % 2 === 0) svg += `<text class="${cur ? 'cur' : ''}" x="${cx}" y="${H - 6}" text-anchor="middle">${shortMonth(d.y, d.m)}</text>`;
  });
  svg += `<line class="base" x1="${padL}" x2="${W}" y1="${y0}" y2="${y0}"/>`;
  data.forEach((_, i) => { svg += `<rect class="hit" data-i="${i}" x="${padL + gw * i}" y="0" width="${gw}" height="${H}"/>`; });

  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Einnahmen und Ausgaben pro Monat">${svg}</svg><div class="tip" hidden></div>`;

  const tip = el.querySelector('.tip');
  const hide = () => { tip.hidden = true; el.classList.remove('hovering'); el.querySelectorAll('.g.active').forEach(g => g.classList.remove('active')); };
  el.onpointermove = el.onpointerdown = ev => {
    const hit = ev.target.closest('[data-i]');
    if (!hit) return hide();
    const i = +hit.dataset.i, d = data[i];
    el.classList.add('hovering');
    el.querySelectorAll('.g').forEach(g => g.classList.toggle('active', +g.dataset.g === i));
    tip.innerHTML = `<b>${monthFmt.format(new Date(d.y, d.m, 1))}</b>
      <i style="background:var(--in-chart)"></i>Einnahmen<span>${eur.format(d.in)}</span><br>
      <i style="background:var(--out-chart)"></i>Ausgaben<span>${eur.format(d.out)}</span><br>
      Saldo<span>${eur.format(d.in - d.out)}</span>`;
    tip.hidden = false;
    const half = tip.offsetWidth / 2;
    tip.style.left = Math.min(Math.max(padL + gw * (i + 0.5), half), W - half) + 'px';
  };
  el.onpointerleave = hide;
}

  openDialog($('settings'));
});
document.querySelectorAll('dialog').forEach(d => {
  d.addEventListener('click', ev => { if (ev.target === d || ev.target.closest('[data-close]')) closeDialog(d); });
  d.addEventListener('cancel', ev => { ev.preventDefault(); closeDialog(d); });
});

/* ---------- Start ---------- */

resetForm();
render();
renderTheme();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
// Sicherung beim Öffnen: erst nach dem ersten Zeichnen, damit nichts bremst
setTimeout(async () => {
  snapshot();
  if (!folderSupported) return;
  try { folder = await kv.get('folder') || null; } catch {}
  if (folder) await backupToFolder(); else renderBackup();
}, 0);
</script>
</body>
</html>
